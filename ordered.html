    <script>
        window.onload = function () {
            document.querySelector('.loading').style.display = 'none';
        };

        function tabMenu(_this, tab) {
            var elements = document.querySelectorAll('.tabber');
            for (let i = 0; i < elements.length; i++) {
                if (elements[i].classList.contains('light')) {
                    elements[i].classList.remove('light');
                }
            }
            _this.classList.add('light');

            var running = document.querySelector('.running');
            var expire = document.querySelector('.expire');

            if (tab == 'active') {
                running.style.display = 'block';
                expire.style.display = 'none';
            }
            if (tab == 'inactive') {
                running.style.display = 'none';
                expire.style.display = 'block';
            }
        }
    </script>
